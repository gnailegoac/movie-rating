name: Sync movie rating cache

on:
  push:
    branches: ["main", "master"]
    paths:
      - "data/ratings-source.json"
      - "lib/ratings.js"
      - "scripts/sync-ratings.mjs"
      - "scripts/validate-ratings.mjs"
      - ".github/workflows/sync-movie-ratings.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movie-rating-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh rating cache
        env:
          RATING_FEED_URL: ${{ secrets.RATING_FEED_URL }}
          RATING_FEED_TOKEN: ${{ secrets.RATING_FEED_TOKEN }}
        run: npm run sync:ratings
      - run: npm run validate:ratings
      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/movies.json data/source-status.json
          git diff --cached --quiet || git commit -m "Update movie rating cache"
          git push
